<!DOCTYPE html>
<html class="dark" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
  tailwind.config = { darkMode: "class", theme: { extend: {
    "colors": { "background": "#0b1326","on-background": "#dae2fd","surface-container-low": "#131b2e","surface-container": "#171f33","surface-container-high": "#222a3d","surface-container-highest": "#2d3449","on-surface": "#dae2fd","on-surface-variant": "#bbcac6","primary": "#4fdbc8","on-primary": "#003731","primary-container": "#14b8a6","outline": "#859490","outline-variant": "#3c4947","error": "#ffb4ab" },
    "spacing": { "sidebar-width": "260px","md": "16px","xs": "4px","sm": "8px","xxl": "48px","gutter": "20px","xl": "32px","lg": "24px","base": "4px" },
    "fontFamily": { "headline-lg": ["Inter"],"label-caps": ["JetBrains Mono"],"body-lg": ["Inter"],"body-sm": ["Inter"],"title-md": ["Inter"] },
    "fontSize": { "headline-lg": ["32px", {"lineHeight":"40px","fontWeight":"600"}],"label-caps": ["12px", {"lineHeight":"16px","letterSpacing":"0.05em","fontWeight":"500"}],"body-lg": ["16px", {"lineHeight":"24px"}],"body-sm": ["14px", {"lineHeight":"20px"}],"title-md": ["20px", {"lineHeight":"28px","fontWeight":"600"}] }
  } } }
</script>
<style>
  body { font-family: 'Inter', sans-serif; }
  .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24; }
  .field { background:#131b2e; border:1px solid #3c4947; border-radius:0.5rem; color:#dae2fd; padding:11px 13px; width:100%; outline:none; font-size:14px; }
  .field:focus { border-color:#4fdbc8; }
  .item { background:#171f33; border:1px solid #2d3449; border-radius:0.5rem; padding:14px; margin-bottom:10px; position:relative; }
  .copy { position:absolute; top:10px; right:10px; background:#222a3d; border:none; color:#bbcac6; font-size:11px; font-weight:700; padding:5px 9px; border-radius:6px; cursor:pointer; }
</style>
</head>
<body class="bg-background text-on-background min-h-screen flex overflow-hidden">
<aside class="fixed left-0 top-0 h-full w-[260px] bg-background border-r border-surface-container flex flex-col py-lg z-50">
  <div class="px-xl mb-xxl flex items-center gap-sm">
    <div class="w-8 h-8 bg-primary rounded-lg flex items-center justify-center text-on-primary"><span class="material-symbols-outlined" style="font-variation-settings:'FILL' 1;">gavel</span></div>
    <div class="flex flex-col"><span class="font-headline-lg text-headline-lg font-bold text-primary">LexAI</span><span class="font-label-caps text-label-caps text-on-surface-variant">Silent Expert</span></div>
  </div>
  <nav class="flex-1 space-y-xs">
    <div class="px-md"><a class="flex items-center gap-md px-md py-sm text-on-surface-variant hover:text-on-surface hover:bg-surface-container-high transition-colors" href="conversaciones.html"><span class="material-symbols-outlined">chat</span><span class="font-body-lg text-body-lg">Conversaciones</span></a></div>
    <div class="px-md"><a class="flex items-center gap-md px-md py-sm text-on-surface-variant hover:text-on-surface hover:bg-surface-container-high transition-colors" href="citas.html"><span class="material-symbols-outlined">calendar_today</span><span class="font-body-lg text-body-lg">Citas</span></a></div>
    <div class="px-md"><a class="flex items-center gap-md px-md py-sm text-on-surface-variant hover:text-on-surface hover:bg-surface-container-high transition-colors" href="pagos.html"><span class="material-symbols-outlined">payments</span><span class="font-body-lg text-body-lg">Pagos</span></a></div>
    <div class="px-md"><a class="flex items-center gap-md px-md py-sm text-on-primary bg-primary-container rounded-lg" href="marketing.html"><span class="material-symbols-outlined">campaign</span><span class="font-body-lg text-body-lg">Marketing IA</span></a></div>
    <div class="px-md"><a class="flex items-center gap-md px-md py-sm text-on-surface-variant hover:text-on-surface hover:bg-surface-container-high transition-colors" href="reputacion.html"><span class="material-symbols-outlined">reviews</span><span class="font-body-lg text-body-lg">Reputación</span></a></div>
    <div class="px-md"><a class="flex items-center gap-md px-md py-sm text-on-surface-variant hover:text-on-surface hover:bg-surface-container-high transition-colors" href="ajustes.html"><span class="material-symbols-outlined">settings</span><span class="font-body-lg text-body-lg">Ajustes</span></a></div>
  </nav>
  <div class="mt-auto px-xl pt-lg border-t border-surface-container">
    <div class="flex items-center gap-md">
      <div class="w-10 h-10 rounded-full bg-surface-container-highest flex items-center justify-center text-primary font-bold">·</div>
      <div class="flex flex-col overflow-hidden"><span class="font-body-lg text-body-lg font-bold truncate text-on-surface" id="negocio-nombre">Negocio</span><span class="font-label-caps text-label-caps text-on-surface-variant">Panel del negocio</span></div>
    </div>
  </div>
</aside>

<main class="ml-[260px] flex-1 flex flex-col h-screen overflow-y-auto">
  <header class="flex justify-between items-center h-20 px-xl bg-background border-b border-surface-container sticky top-0 z-40">
    <div><h1 class="font-headline-lg text-title-md font-bold text-on-surface">🎬 Marketing IA</h1><p class="text-body-sm text-on-surface-variant">Genera tu publicidad en un clic — anuncios, posts y guion de vídeo.</p></div>
  </header>

  <div class="p-xl max-w-[720px]">
    <div class="item" style="position:static;">
      <label class="text-body-sm text-on-surface-variant">¿Qué quieres promocionar / lograr?</label>
      <input id="objetivo" class="field mt-1" placeholder="Ej: captar casos de despidos en Tenerife"/>
      <div class="grid grid-cols-2 gap-3 mt-3">
        <div><label class="text-body-sm text-on-surface-variant">Tono</label>
          <select id="tono" class="field mt-1"><option>cercano y profesional</option><option>directo y claro</option><option>cercano y de confianza</option><option>serio y experto</option></select></div>
        <div><label class="text-body-sm text-on-surface-variant">Canal</label>
          <select id="canal" class="field mt-1"><option>Instagram</option><option>Facebook</option><option>LinkedIn</option><option>Google</option><option>TikTok</option></select></div>
      </div>
      <button id="gen" class="mt-4 w-full bg-primary text-on-primary font-bold rounded-lg py-3 hover:opacity-90 transition-opacity">✨ Generar campaña</button>
      <div id="msg" class="text-center text-body-sm text-on-surface-variant mt-3 min-h-[16px]"></div>
    </div>

    <div id="out" class="hidden mt-2"></div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="lexai-auth.js"></script>
<script>
(async function(){
  const s = await lxGuard(); if(!s) return;
  const $ = id => document.getElementById(id);
  const esc = t => (t||'').replace(/</g,'&lt;');
  try { const r = await lxApi('/api/rec/ajustes'); const d = await r.json(); if(d && d.nombre) $('negocio-nombre').textContent = d.nombre; } catch(e){}

  window.__cp = (txt,btn)=>{ navigator.clipboard.writeText(txt).then(()=>{ const o=btn.textContent; btn.textContent='✓'; setTimeout(()=>btn.textContent=o,1200); }); };
  const item = (tit,txt,badge)=>`<div class="item"><button class="copy" onclick="__cp(${JSON.stringify((tit?tit+'\n\n':'')+txt)},this)">copiar</button>${badge?`<span class="font-label-caps text-label-caps text-primary">${esc(badge)}</span>`:''}${tit?`<p class="font-bold text-on-surface mt-1">${esc(tit)}</p>`:''}<p class="text-body-sm text-on-surface-variant whitespace-pre-line mt-1">${esc(txt)}</p></div>`;

  $('gen').addEventListener('click', async ()=>{
    const objetivo = $('objetivo').value.trim();
    if(!objetivo){ $('msg').textContent='Escribe qué quieres promocionar.'; return; }
    $('gen').disabled=true; $('msg').textContent='✨ Creando tu campaña…'; $('out').classList.add('hidden');
    try {
      const r = await lxApi('/api/rec/marketing/generar', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ objetivo, tono:$('tono').value, canal:$('canal').value }) });
      if(!r.ok) throw new Error();
      const d = await r.json();
      let html = '<h2 class="font-bold text-primary mt-4 mb-2">📢 Anuncios</h2>';
      html += (d.anuncios||[]).map(a=>item(a.titular, a.texto + (a.cta?'\n\n👉 '+a.cta:''))).join('') || '<p class="text-body-sm text-on-surface-variant">—</p>';
      html += '<h2 class="font-bold text-primary mt-4 mb-2">🎥 Guion de vídeo</h2>' + (d.guion_video?item('',d.guion_video):'<p class="text-body-sm text-on-surface-variant">—</p>');
      html += '<h2 class="font-bold text-primary mt-4 mb-2">📱 Posts</h2>' + ((d.posts||[]).map(p=>item('',p.texto,p.red)).join('') || '—');
      html += '<h2 class="font-bold text-primary mt-4 mb-2">💡 Ideas de esta semana</h2><ul class="list-disc pl-5 text-body-sm text-on-surface-variant">' + (d.ideas||[]).map(i=>`<li>${esc(i)}</li>`).join('') + '</ul>';
      $('out').innerHTML = html; $('out').classList.remove('hidden'); $('msg').textContent='';
    } catch(e){ $('msg').textContent='No se pudo generar. Inténtalo de nuevo.'; }
    finally { $('gen').disabled=false; }
  });
})();
</script>
</body></html>
