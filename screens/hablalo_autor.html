<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Háblalo · Publica tu contenido</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{primary:"#446350",secondary:"#904c28",surface:"#effdf4","surf-low":"#e9f7ee","surf-c":"#e4f1e8",tinta:"#121e19","tinta-v":"#424843",linea:"#c2c8c1"},fontFamily:{sans:["Plus Jakarta Sans","system-ui","sans-serif"]}}}};</script>
<style>body{font-family:'Plus Jakarta Sans',system-ui,sans-serif}</style>
</head>
<body class="bg-surface text-tinta min-h-screen">
<div class="max-w-3xl mx-auto px-4 py-6">
  <header class="flex items-center justify-between mb-6">
    <div>
      <h1 class="text-2xl font-bold text-primary">Háblalo · Tu contenido</h1>
      <p class="text-sm text-tinta-v">Comparte conocimiento y gana visibilidad. Tu contenido se revisa antes de publicarse.</p>
    </div>
    <a href="/hablalo" class="text-sm text-primary font-semibold">Ver Háblalo →</a>
  </header>

  <div id="gate" class="hidden bg-white rounded-2xl p-6 border border-linea text-center">
    <p id="gate-msg" class="text-tinta-v">Comprobando sesión…</p>
    <a href="/login" class="inline-block mt-3 text-primary font-semibold">Iniciar sesión</a>
  </div>

  <div id="app" class="hidden">
    <div class="bg-white rounded-2xl p-4 border border-linea mb-5">
      <p class="text-sm">Hola, <strong id="mi-nombre"></strong> <span id="mi-perfil"></span></p>
    </div>
    <div class="grid md:grid-cols-2 gap-6">
      <section class="bg-white rounded-2xl p-5 border border-linea">
        <h2 class="font-bold text-lg mb-3">Nuevo contenido</h2>
        <form id="form" class="flex flex-col gap-3">
          <label class="text-sm font-semibold">Título
            <input id="f_titulo" class="mt-1 w-full border border-linea rounded-lg px-3 py-2">
          </label>
          <div class="grid grid-cols-2 gap-3">
            <label class="text-sm font-semibold">Tema
              <select id="f_tema" class="mt-1 w-full border border-linea rounded-lg px-3 py-2 bg-surf-low"></select>
            </label>
            <label class="text-sm font-semibold">Tipo
              <select id="f_tipo" class="mt-1 w-full border border-linea rounded-lg px-3 py-2 bg-surf-low">
                <option value="breve">Publicación breve</option>
                <option value="consejo">Consejo</option><option value="guia">Guía</option>
                <option value="video">Vídeo</option><option value="herramienta">Herramienta</option>
                <option value="qa">Preguntas y respuestas</option>
              </select>
            </label>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <label class="text-sm font-semibold">Minutos de lectura
              <input id="f_min" type="number" min="1" class="mt-1 w-full border border-linea rounded-lg px-3 py-2">
            </label>
            <label class="text-sm font-semibold">Imagen (URL, opcional)
              <input id="f_media" class="mt-1 w-full border border-linea rounded-lg px-3 py-2" placeholder="https://…">
            </label>
          </div>
          <label class="text-sm font-semibold">Cuerpo (usa ## para títulos y - para listas)
            <textarea id="f_cuerpo" rows="9" class="mt-1 w-full border border-linea rounded-lg px-3 py-2"></textarea>
          </label>
          <label class="flex items-center gap-2 text-sm font-semibold"><input id="f_solo" type="checkbox" class="w-4 h-4"> Solo para registrados (vídeo/webinar)</label>
          <button class="bg-secondary text-white font-semibold rounded-lg py-2.5 mt-1">Enviar a revisión</button>
          <p class="text-xs text-tinta-v">Lo revisamos y, si todo está bien, lo publicamos en tu perfil de Háblalo.</p>
          <p id="form-msg" class="text-sm"></p>
        </form>
      </section>

      <section class="bg-white rounded-2xl p-5 border border-linea">
        <h2 class="font-bold text-lg mb-3">Tus publicaciones</h2>
        <div id="lista" class="flex flex-col gap-2 max-h-[70vh] overflow-auto"><p class="text-tinta-v text-sm">Cargando…</p></div>
      </section>
    </div>
  </div>
</div>

<script type="module">
import { supabase } from '/js/supabase-client.js';
const $ = s => document.querySelector(s);
let token = null, miSlug = null;

async function init() {
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) { gate('Inicia sesión con tu cuenta de psicólogo.'); return; }
  token = session.access_token;
  const r = await api('/api/hablalo/autor-panel/info');
  if (r.status === 403) { gate('Tu cuenta no está asociada a un perfil de psicólogo.'); return; }
  if (!r.ok) { gate('Error al cargar. Reintenta.'); return; }
  const { psi, temas } = await r.json();
  miSlug = psi.slug;
  $('#mi-nombre').textContent = psi.nombre;
  $('#mi-perfil').innerHTML = psi.slug ? `· <a class="text-primary font-semibold" href="/hablalo/autor/${psi.slug}" target="_blank">ver tu perfil público</a>` : '';
  $('#f_tema').innerHTML = '<option value="">—</option>' + (temas || []).map(t => `<option value="${t.slug}">${t.nombre}</option>`).join('');
  $('#gate').classList.add('hidden'); $('#app').classList.remove('hidden');
  loadLista();
}
function gate(msg) { $('#gate').classList.remove('hidden'); $('#gate-msg').textContent = msg; }
function api(path, opts = {}) {
  return fetch(path, { ...opts, headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json', ...(opts.headers || {}) } });
}
async function loadLista() {
  const { contenidos } = await (await api('/api/hablalo/autor-panel/mis-contenidos')).json();
  if (!contenidos.length) { $('#lista').innerHTML = '<p class="text-tinta-v text-sm">Aún no has publicado nada. ¡Empieza con tu primer consejo!</p>'; return; }
  const color = { publicado: 'text-green-700 bg-green-100', en_revision: 'text-amber-700 bg-amber-100', rechazado: 'text-red-700 bg-red-100' };
  $('#lista').innerHTML = contenidos.map(c => `
    <div class="border border-linea rounded-xl p-3">
      <div class="flex items-start justify-between gap-2">
        <div class="min-w-0"><p class="font-semibold text-sm truncate">${escp(c.titulo)}</p>
        <p class="text-xs text-tinta-v">${escp(c.tema||'—')} · ${c.vistas||0} vistas</p></div>
        <span class="text-[11px] font-bold px-2 py-0.5 rounded-full ${color[c.estado]||''}">${c.estado.replace('_',' ')}</span>
      </div>
      ${c.estado==='publicado' ? `<a class="text-primary font-semibold text-xs mt-2 inline-block" href="/hablalo/articulo/${c.slug}" target="_blank">Ver publicado →</a>` : ''}
    </div>`).join('');
}
$('#form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = $('#form-msg'); msg.textContent = 'Enviando…'; msg.className = 'text-sm text-tinta-v';
  const body = { titulo: $('#f_titulo').value.trim(), tema: $('#f_tema').value || null, tipo: $('#f_tipo').value,
    tiempo_min: $('#f_min').value || null, media_url: $('#f_media').value.trim() || null, cuerpo_md: $('#f_cuerpo').value, solo_registrados: $('#f_solo').checked };
  if (!body.titulo) { msg.textContent = 'Falta el título.'; return; }
  const r = await api('/api/hablalo/autor-panel/contenido', { method: 'POST', body: JSON.stringify(body) });
  if (r.ok) { msg.textContent = '✅ Enviado a revisión.'; msg.className = 'text-sm text-green-700'; $('#form').reset(); loadLista(); }
  else { const e2 = await r.json().catch(()=>({})); msg.textContent = '❌ ' + (e2.error || 'Error'); msg.className = 'text-sm text-red-700'; }
});
function escp(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
init();
</script>
</body>
</html>
