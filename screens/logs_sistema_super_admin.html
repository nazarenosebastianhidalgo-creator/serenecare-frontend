<!DOCTYPE html>
<html class="dark" lang="es">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link rel="stylesheet" href="/css/tailwind.css">
  <script>window.tailwind=window.tailwind||{};</script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<style>
  body { font-family: 'Inter', sans-serif; background: #020617; color: #e2e8f0; }
  .font-headline { font-family: 'Manrope', sans-serif; }
  .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
  .filled { font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
  ::-webkit-scrollbar { width: 4px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
  .log-line { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; font-size: 12px; }
  @keyframes blink { 0%,100% { opacity:1; } 50% { opacity:0; } }
  .cursor-blink { animation: blink 1s step-end infinite; }
</style>
<style>/* SCALE-BASE-14 */ html{font-size:14px;}</style>
</head>
<body class="min-h-screen flex overflow-hidden">

<!-- Sidebar Navigation (unificado) -->
<div id="superadmin-sidebar"></div>
<script src="/js/sidebar-super-admin.js"></script>

<!-- Header -->
<header class="fixed top-0 left-72 right-0 h-20 bg-slate-950/80 backdrop-blur-xl border-b border-slate-800/10 flex items-center justify-between px-8 z-20">
  <div>
    <h2 class="font-headline text-xl font-extrabold text-slate-50 tracking-tighter">Logs del Sistema</h2>
    <p class="text-slate-500 text-xs">Eventos en tiempo real — infraestructura global</p>
  </div>
  <div class="flex items-center gap-3">
    <div class="flex items-center gap-2 px-3 py-1 rounded-full" style="background:rgba(34,197,94,0.1);">
      <span class="w-2 h-2 rounded-full bg-green-400 animate-pulse"></span>
      <span class="text-green-400 text-xs font-bold">Live</span>
    </div>
    <select id="filtro-nivel" class="bg-slate-800 border border-slate-700 text-slate-300 text-xs rounded-xl px-3 py-2 focus:ring-indigo-500 focus:border-indigo-500">
      <option value="all">Todos los niveles</option>
      <option value="INFO">INFO</option>
      <option value="WARN">WARN</option>
      <option value="ERROR">ERROR</option>
      <option value="DEBUG">DEBUG</option>
    </select>
    <button id="btn-limpiar" class="text-xs text-slate-500 hover:text-slate-300 px-3 py-2 rounded-xl hover:bg-slate-800 transition-colors flex items-center gap-1">
      <span class="material-symbols-outlined text-sm">delete_sweep</span> Limpiar
    </button>
    <button id="btn-pause" class="text-xs text-indigo-400 hover:text-indigo-300 px-4 py-2 rounded-xl hover:bg-indigo-500/10 transition-colors flex items-center gap-1">
      <span class="material-symbols-outlined text-sm" id="pause-icon">pause</span>
      <span id="pause-label">Pausar</span>
    </button>
  </div>
</header>

<!-- Main -->
<main class="ml-72 mt-20 flex flex-col min-h-[calc(100vh-5rem)] p-6">

  <!-- Stats row -->
  <div class="grid grid-cols-4 gap-4 mb-6">
    <div class="bg-slate-900 rounded-2xl p-4 border border-slate-800/50">
      <p class="text-[10px] uppercase tracking-widest text-slate-500 mb-1">Total eventos</p>
      <p class="text-xl font-bold text-white" id="cnt-total">0</p>
    </div>
    <div class="bg-slate-900 rounded-2xl p-4 border border-slate-800/50">
      <p class="text-[10px] uppercase tracking-widest text-slate-500 mb-1">Errores (1h)</p>
      <p class="text-xl font-bold text-red-400" id="cnt-errores">0</p>
    </div>
    <div class="bg-slate-900 rounded-2xl p-4 border border-slate-800/50">
      <p class="text-[10px] uppercase tracking-widest text-slate-500 mb-1">Warnings</p>
      <p class="text-xl font-bold text-amber-400" id="cnt-warns">0</p>
    </div>
    <div class="bg-slate-900 rounded-2xl p-4 border border-slate-800/50">
      <p class="text-[10px] uppercase tracking-widest text-slate-500 mb-1">Tipos de recurso</p>
      <p class="text-xl font-bold text-indigo-400" id="cnt-clinicas">0</p>
    </div>
  </div>

  <!-- Terminal window -->
  <div class="flex-1 bg-slate-900 rounded-2xl border border-slate-800/50 overflow-hidden flex flex-col">
    <!-- Terminal top bar -->
    <div class="flex items-center gap-2 px-5 py-3 bg-slate-800/60 border-b border-slate-700/40">
      <span class="w-3 h-3 rounded-full bg-red-500/70"></span>
      <span class="w-3 h-3 rounded-full bg-amber-500/70"></span>
      <span class="w-3 h-3 rounded-full bg-green-500/70"></span>
      <span class="text-slate-500 text-xs ml-3 font-mono">serecare-logs — bash — 120×40</span>
      <div class="ml-auto flex items-center gap-2 text-[10px] text-slate-600 font-mono">
        <span id="log-timestamp">--:--:--</span>
      </div>
    </div>
    <!-- Log output -->
    <div id="log-output" class="flex-1 p-5 overflow-y-auto space-y-1" style="max-height: calc(100vh - 340px);">
      <!-- Log lines injected here -->
    </div>
    <!-- Input bar -->
    <div class="flex items-center gap-2 px-5 py-3 border-t border-slate-800/40 bg-slate-950/50">
      <span class="text-green-400 font-mono text-xs">admin@serecare:~$</span>
      <span class="text-slate-300 font-mono text-xs">tail -f /var/log/serecare/system.log</span>
      <span class="text-white font-mono text-xs cursor-blink">▋</span>
    </div>
  </div>
</main>

<!-- Module script -->
<script type="module">
  import { supabase } from '../js/supabase-client.js'
  import { guardaSuperAdmin } from '../js/admin.js'

  const session = await guardaSuperAdmin()
  if (!session) { throw new Error('redirigiendo') }

  let paused = false
  let allLogs = []

  function ts() {
    const now = new Date()
    return now.toLocaleTimeString('es-ES', { hour12: false })
  }

  function nivelColor(n) {
    if (n === 'ERROR') return '#f87171'
    if (n === 'WARN')  return '#fbbf24'
    if (n === 'DEBUG') return '#94a3b8'
    return '#4ade80'
  }

  function addLog(nivel, fuente, mensaje, time) {
    if (paused) return
    const line = { nivel, fuente, mensaje, time: time || ts() }
    allLogs.push(line)
    renderLogs()
    actualizarContadores()
  }

  // Convierte una fila real de logs_acceso en una línea de log legible
  const NIVEL_ACCION = { lectura:'DEBUG', creacion:'INFO', modificacion:'WARN', borrado:'ERROR', exportacion:'WARN', login:'INFO' }
  const ACCION_TXT = { lectura:'consultó', creacion:'creó', modificacion:'modificó', borrado:'borró', exportacion:'exportó', login:'inició sesión en' }
  const RECURSO_TXT = { pacientes:'una ficha de paciente', notas_soap:'una nota SOAP', evaluaciones:'una evaluación', citas:'una cita', consentimientos:'un consentimiento', usuarios:'una cuenta', clinicas:'una clínica' }
  function logDeAcceso(l) {
    const nivel = NIVEL_ACCION[l.accion] || 'INFO'
    const quien = l.actor_rol || 'usuario'
    const acc = ACCION_TXT[l.accion] || (l.accion || 'acción sobre')
    const rec = RECURSO_TXT[l.recurso] || (l.recurso || 'un recurso')
    const det = l.detalle ? ' — ' + l.detalle : ''
    const ip = l.ip ? ' · IP ' + l.ip : ''
    const hora = l.created_at ? new Date(l.created_at).toLocaleTimeString('es-ES', { hour12:false }) : ts()
    return { nivel, fuente: 'audit.' + (l.recurso || 'sistema'), mensaje: `${quien} ${acc} ${rec}${det}${ip}`, time: hora }
  }

  const filtro = document.getElementById('filtro-nivel')

  function renderLogs() {
    const f = filtro.value
    const visible = f === 'all' ? allLogs : allLogs.filter(l => l.nivel === f)
    const container = document.getElementById('log-output')
    container.innerHTML = visible.slice(-200).map(l => `
      <div class="log-line flex gap-3 hover:bg-slate-800/30 px-2 py-0.5 rounded">
        <span class="text-slate-600 shrink-0 w-20">${l.time}</span>
        <span class="font-bold w-14 shrink-0" style="color:${nivelColor(l.nivel)}">${l.nivel}</span>
        <span class="text-indigo-400/70 shrink-0 w-32 truncate">${l.fuente}</span>
        <span class="text-slate-300">${l.mensaje}</span>
      </div>
    `).join('')
    container.scrollTop = container.scrollHeight
  }

  function actualizarContadores() {
    document.getElementById('cnt-total').textContent = allLogs.length
    document.getElementById('cnt-errores').textContent = allLogs.filter(l => l.nivel === 'ERROR').length
    document.getElementById('cnt-warns').textContent = allLogs.filter(l => l.nivel === 'WARN').length
    const recursos = new Set(allLogs.map(l => l.fuente)).size
    document.getElementById('cnt-clinicas').textContent = recursos
  }

  // Carga los últimos accesos REALES de la tabla de auditoría logs_acceso
  async function cargarLogsReales() {
    const { data: logs } = await supabase
      .from('logs_acceso')
      .select('*')
      .order('created_at', { ascending: false })
      .limit(80)

    if (logs && logs.length > 0) {
      logs.reverse().forEach(l => {
        const x = logDeAcceso(l)
        addLog(x.nivel, x.fuente, x.mensaje, x.time)
      })
    } else {
      addLog('INFO', 'audit.sistema', 'Sin eventos de acceso registrados todavía.')
    }
  }

  await cargarLogsReales()

  // Stream EN VIVO REAL: nuevos accesos aparecen al instante (Supabase Realtime)
  supabase.channel('logs-acceso-live')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'logs_acceso' }, (payload) => {
      if (paused || !payload.new) return
      const x = logDeAcceso(payload.new)
      addLog(x.nivel, x.fuente, x.mensaje, x.time)
    })
    .subscribe()

  // Reloj
  setInterval(() => {
    document.getElementById('log-timestamp').textContent = ts()
  }, 1000)

  // Pause button
  document.getElementById('btn-pause').addEventListener('click', () => {
    paused = !paused
    document.getElementById('pause-icon').textContent = paused ? 'play_arrow' : 'pause'
    document.getElementById('pause-label').textContent = paused ? 'Reanudar' : 'Pausar'
  })

  // Clear button
  document.getElementById('btn-limpiar').addEventListener('click', () => {
    allLogs = []
    document.getElementById('log-output').innerHTML = ''
    actualizarContadores()
    addLog('INFO', 'console', 'Log limpiado por administrador')
  })

  // Filter
  filtro.addEventListener('change', renderLogs)

  // Logout
  document.getElementById('btn-logout').addEventListener('click', async () => {
    await supabase.auth.signOut()
    localStorage.removeItem('tp_rol')
    localStorage.removeItem('tp_user_id')
    localStorage.removeItem('tp_email')
    window.location.href = 'acceso_super_admin.html'
  })
</script>

<script type="module">import { initMantenimientoToggle } from "../js/mantenimiento-toggle.js"; initMantenimientoToggle();</script>
</body>
</html>
