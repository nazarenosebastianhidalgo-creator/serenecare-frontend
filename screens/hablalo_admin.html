<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Háblalo · Admin de contenido</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{primary:"#446350","primary-c":"#5c7c67",secondary:"#904c28",surface:"#effdf4","surf-low":"#e9f7ee","surf-c":"#e4f1e8",tinta:"#121e19","tinta-v":"#424843",linea:"#c2c8c1"},fontFamily:{sans:["Plus Jakarta Sans","system-ui","sans-serif"]}}}};</script>
<style>body{font-family:'Plus Jakarta Sans',system-ui,sans-serif}</style>
</head>
<body class="bg-surface text-tinta min-h-screen">
<div class="max-w-4xl mx-auto px-4 py-6">
  <header class="flex items-center justify-between mb-6">
    <div>
      <h1 class="text-2xl font-bold text-primary">Háblalo · Admin de contenido</h1>
      <p class="text-sm text-tinta-v">Crea y modera los artículos y herramientas de los psicólogos.</p>
    </div>
    <a href="/hablalo" class="text-sm text-primary font-semibold">Ver Háblalo →</a>
  </header>

  <div id="gate" class="hidden bg-white rounded-2xl p-6 border border-linea text-center">
    <p id="gate-msg" class="text-tinta-v">Comprobando sesión…</p>
    <a href="/acceso" class="inline-block mt-3 text-primary font-semibold">Iniciar sesión</a>
  </div>

  <div id="app" class="hidden grid md:grid-cols-2 gap-6">
    <!-- Crear -->
    <section class="bg-white rounded-2xl p-5 border border-linea">
      <h2 class="font-bold text-lg mb-3">Nuevo contenido</h2>
      <form id="form" class="flex flex-col gap-3">
        <label class="text-sm font-semibold">Autor (psicólogo)
          <select id="f_autor" class="mt-1 w-full border border-linea rounded-lg px-3 py-2 bg-surf-low" required></select>
        </label>
        <label class="text-sm font-semibold">Título
          <input id="f_titulo" class="mt-1 w-full border border-linea rounded-lg px-3 py-2">
        </label>
        <div class="grid grid-cols-2 gap-3">
          <label class="text-sm font-semibold">Tema
            <select id="f_tema" class="mt-1 w-full border border-linea rounded-lg px-3 py-2 bg-surf-low"></select>
          </label>
          <label class="text-sm font-semibold">Tipo
            <select id="f_tipo" class="mt-1 w-full border border-linea rounded-lg px-3 py-2 bg-surf-low">
              <option value="breve">Publicación breve</option>
              <option value="consejo">Consejo</option><option value="guia">Guía / artículo</option>
              <option value="video">Vídeo</option><option value="ejercicio">Ejercicio práctico</option>
              <option value="evento">Evento / actividad</option>
              <option value="qa">Preguntas y respuestas</option><option value="serie">Serie</option>
            </select>
          </label>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <label class="text-sm font-semibold">Minutos de lectura
            <input id="f_min" type="number" min="1" class="mt-1 w-full border border-linea rounded-lg px-3 py-2">
          </label>
          <label class="text-sm font-semibold"><span id="f_media_lbl">Imagen o vídeo (URL, opcional)</span>
            <input id="f_media" class="mt-1 w-full border border-linea rounded-lg px-3 py-2" placeholder="Imagen, o enlace de YouTube/Vimeo">
          </label>
        </div>
        <div id="evento-fields" class="hidden grid grid-cols-2 gap-3">
          <label class="text-sm font-semibold">Fecha y hora del evento
            <input id="f_evento_fecha" type="datetime-local" class="mt-1 w-full border border-linea rounded-lg px-3 py-2">
          </label>
          <label class="text-sm font-semibold">Enlace para apuntarse (opcional)
            <input id="f_evento_enlace" class="mt-1 w-full border border-linea rounded-lg px-3 py-2" placeholder="https://…">
          </label>
        </div>
        <label class="text-sm font-semibold">Cuerpo (texto. Usa ## para títulos y - para listas)
          <textarea id="f_cuerpo" rows="8" class="mt-1 w-full border border-linea rounded-lg px-3 py-2"></textarea>
        </label>
        <label class="text-sm font-semibold">Estado
          <select id="f_estado" class="mt-1 w-full border border-linea rounded-lg px-3 py-2 bg-surf-low">
            <option value="publicado">Publicar ya</option>
            <option value="en_revision">Dejar en revisión</option>
          </select>
        </label>
        <label class="flex items-center gap-2 text-sm font-semibold"><input id="f_solo" type="checkbox" class="w-4 h-4"> Solo para registrados (vídeos, webinars, premium)</label>
        <label class="flex items-center gap-2 text-sm font-semibold"><input id="f_destacado" type="checkbox" class="w-4 h-4"> Destacado (aparece arriba en el muro)</label>
        <button class="bg-secondary text-white font-semibold rounded-lg py-2.5 mt-1">Guardar contenido</button>
        <p id="form-msg" class="text-sm"></p>
      </form>
    </section>

    <!-- Lista / moderar -->
    <section class="bg-white rounded-2xl p-5 border border-linea">
      <h2 class="font-bold text-lg mb-3">Contenido</h2>
      <div id="lista" class="flex flex-col gap-2 max-h-[70vh] overflow-auto"><p class="text-tinta-v text-sm">Cargando…</p></div>
    </section>
  </div>
</div>

<script type="module">
import { supabase } from '/js/supabase-client.js';

const $ = s => document.querySelector(s);
let token = null;

async function init() {
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) { showGate('Necesitas iniciar sesión como super admin.'); return; }
  token = session.access_token;
  // Probar acceso cargando psicólogos (el backend valida super_admin)
  const r = await api('/api/hablalo/admin/psicologos');
  if (r.status === 403) { showGate('Tu cuenta no es super admin.'); return; }
  if (!r.ok) { showGate('Error al cargar. Reintenta.'); return; }
  const { psicologos } = await r.json();
  fillSelect('#f_autor', psicologos.map(p => ({ v: p.id, t: p.nombre + (p.verificado ? ' ✓' : '') })));
  const tr = await (await api('/api/hablalo/admin/temas')).json();
  fillSelect('#f_tema', (tr.temas || []).map(t => ({ v: t.slug, t: t.nombre })), true);
  $('#gate').classList.add('hidden'); $('#app').classList.remove('hidden');
  loadLista();
}

function showGate(msg) { $('#gate').classList.remove('hidden'); $('#gate-msg').textContent = msg; }
function api(path, opts = {}) {
  return fetch(path, { ...opts, headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json', ...(opts.headers || {}) } });
}
function fillSelect(sel, items, blankFirst) {
  const el = $(sel); el.innerHTML = (blankFirst ? '<option value="">—</option>' : '') + items.map(i => `<option value="${i.v}">${i.t}</option>`).join('');
}

async function loadLista() {
  const r = await api('/api/hablalo/admin/contenidos');
  const { contenidos } = await r.json();
  if (!contenidos.length) { $('#lista').innerHTML = '<p class="text-tinta-v text-sm">Aún no hay contenido.</p>'; return; }
  const color = { publicado: 'text-green-700 bg-green-100', en_revision: 'text-amber-700 bg-amber-100', rechazado: 'text-red-700 bg-red-100' };
  $('#lista').innerHTML = contenidos.map(c => `
    <div class="border border-linea rounded-xl p-3">
      <div class="flex items-start justify-between gap-2">
        <div class="min-w-0">
          <p class="font-semibold text-sm truncate">${escp(c.titulo)}</p>
          <p class="text-xs text-tinta-v">${escp(c.autor_nombre)} · ${escp(c.tema||'—')} · ${c.vistas||0} vistas</p>
        </div>
        <span class="text-[11px] font-bold px-2 py-0.5 rounded-full ${color[c.estado]||''}">${c.estado}</span>
      </div>
      <div class="flex gap-2 mt-2 text-xs">
        ${c.estado==='publicado' ? `<a class="text-primary font-semibold" href="/hablalo/articulo/${c.slug}" target="_blank">Ver</a>` : ''}
        ${c.estado!=='publicado' ? `<button class="text-green-700 font-semibold" data-id="${c.id}" data-e="publicado">Publicar</button>` : ''}
        ${c.estado!=='rechazado' ? `<button class="text-red-700 font-semibold" data-id="${c.id}" data-e="rechazado">Rechazar</button>` : ''}
      </div>
    </div>`).join('');
  $('#lista').querySelectorAll('button[data-id]').forEach(b => b.onclick = () => moderar(b.dataset.id, b.dataset.e));
}

async function moderar(id, estado) {
  await api(`/api/hablalo/admin/contenido/${id}/estado`, { method: 'POST', body: JSON.stringify({ estado }) });
  loadLista();
}

$('#form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = $('#form-msg'); msg.textContent = 'Guardando…'; msg.className = 'text-sm text-tinta-v';
  const fechaRaw = $('#f_evento_fecha').value;
  const esEvento = $('#f_tipo').value === 'evento';
  const body = {
    autor_id: $('#f_autor').value, titulo: $('#f_titulo').value.trim(), tema: $('#f_tema').value || null,
    tipo: $('#f_tipo').value, tiempo_min: $('#f_min').value || null, media_url: $('#f_media').value.trim() || null,
    cuerpo_md: $('#f_cuerpo').value, estado: $('#f_estado').value, solo_registrados: $('#f_solo').checked, destacado: $('#f_destacado').checked,
    evento_fecha: (esEvento && fechaRaw) ? new Date(fechaRaw).toISOString() : null,
    evento_enlace: esEvento ? ($('#f_evento_enlace').value.trim() || null) : null,
  };
  if (!body.titulo) { msg.textContent = 'Falta el título.'; return; }
  const r = await api('/api/hablalo/admin/contenido', { method: 'POST', body: JSON.stringify(body) });
  if (r.ok) { msg.textContent = '✅ Guardado.'; msg.className = 'text-sm text-green-700'; $('#form').reset(); $('#evento-fields').classList.add('hidden'); loadLista(); }
  else { const e2 = await r.json().catch(()=>({})); msg.textContent = '❌ ' + (e2.error || 'Error'); msg.className = 'text-sm text-red-700'; }
});

$('#f_tipo').addEventListener('change', () => {
  const t = $('#f_tipo').value;
  $('#evento-fields').classList.toggle('hidden', t !== 'evento');
  $('#evento-fields').classList.toggle('grid', t === 'evento');
  $('#f_media_lbl').textContent = (t === 'video') ? 'Enlace del vídeo (YouTube, Vimeo o .mp4)' : 'Imagen o vídeo (URL, opcional)';
});

function escp(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
init();
</script>
</body>
</html>
