<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SereneCare — Cuestionario GAD-7</title>
<link rel="stylesheet" href="/css/tailwind.css">
  <script>window.tailwind=window.tailwind||{};</script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Inter:wght@400;500;600&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<style>
  .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
  body { background-color: #020617; font-family: 'Inter', sans-serif; }
  .sidebar-dark { background-color: #0a1628; }
  .nav-active { background: rgba(52,211,153,0.12); color: #34d399; }
  .nav-item { color: #94a3b8; transition: all 0.2s; }
  .nav-item:hover { background: rgba(255,255,255,0.05); color: #e2e8f0; }
  .font-headline { font-family: 'Manrope', sans-serif; }
  .opcion-btn { background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.07);transition:all 0.2s; }
  .opcion-btn:hover { background:rgba(255,255,255,0.07); }
  .opcion-activa { background:rgba(96,165,250,0.1) !important; border-color:rgba(96,165,250,0.4) !important; }
</style>
<style>
html.light body{background-color:#f1f5f9;color:#1e293b;}
html.light .sidebar-dark{background-color:#ffffff!important;border-right-color:#e2e8f0!important;}
html.light .nav-item{color:#64748b!important;}
html.light .nav-item:hover{background:#f1f5f9!important;color:#334155!important;}
html.light .nav-active{background:rgba(5,150,105,0.12)!important;color:#059669!important;}
html.light .text-white{color:#0f172a!important;}
html.light .text-slate-200{color:#334155!important;}
html.light .text-slate-400{color:#64748b!important;}
html.light .text-slate-500{color:#94a3b8!important;}
html.light .opcion-btn{background:#ffffff!important;border-color:#e2e8f0!important;}
html.light .opcion-btn:hover{background:#f8fafc!important;}
</style>
</head>
<body class="text-slate-200 antialiased min-h-screen">

<!-- SIDEBAR -->
<div id="paciente-sidebar"></div>
<script src="/js/sidebar-paciente.js"></script>

<!-- MAIN -->
<main class="pl-64 min-h-screen flex flex-col">

  <!-- Header -->
  <header class="sticky top-0 h-16 flex items-center justify-between px-8 z-40 border-b border-slate-800/20 flex-shrink-0" style="background:rgba(2,6,23,0.85);backdrop-filter:blur(16px);">
    <div class="flex items-center gap-3">
      <a href="escalas_paciente.html" class="text-slate-400 hover:text-white transition-colors" style="text-decoration:none;">
        <span class="material-symbols-outlined text-xl">arrow_back</span>
      </a>
      <div>
        <h2 class="font-headline font-extrabold text-white tracking-tight">Cuestionario GAD-7</h2>
        <p class="text-slate-500 text-xs">Escala de ansiedad generalizada</p>
      </div>
    </div>
    <div class="flex items-center gap-3">
      <span id="progreso-texto" class="text-xs text-slate-500 font-bold">Pregunta 1 de 7</span>
      <div class="w-32 h-1.5 rounded-full overflow-hidden" style="background:rgba(255,255,255,0.06);">
        <div id="progreso-barra" class="h-full rounded-full transition-all duration-500" style="width:14%;background:#60a5fa;"></div>
      </div>
      <button onclick="toggleAppsPanel()" title="Módulos" style="padding:7px;border-radius:10px;border:none;background:none;cursor:pointer;color:#94a3b8;transition:background 0.15s;flex-shrink:0;" onmouseover="this.style.background='rgba(255,255,255,0.06)'" onmouseout="this.style.background='none'"><span class="material-symbols-outlined" style="font-size:22px;display:block;">apps</span></button>
      <button onclick="toggleNotif()" style="position:relative;padding:7px;border-radius:10px;border:none;background:none;cursor:pointer;color:#94a3b8;transition:background 0.15s;flex-shrink:0;" onmouseover="this.style.background='rgba(255,255,255,0.06)'" onmouseout="this.style.background='none'"><span class="material-symbols-outlined" style="font-size:22px;display:block;">notifications</span><span style="position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:#f87171;border:2px solid #020617;"></span></button>
    </div>
  </header>

  <!-- Contenido del cuestionario -->
  <div class="flex-1 flex flex-col items-center justify-center px-8 py-12">
    <div class="w-full max-w-xl">

      <!-- Pregunta -->
      <div class="mb-10 text-center">
        <p class="text-xs font-bold uppercase tracking-widest mb-4" style="color:#60a5fa;">GAD-7 — Durante las últimas 2 semanas</p>
        <h1 id="pregunta-texto" class="font-headline font-bold text-2xl text-white leading-snug">
          Sentirse nervioso, ansioso o muy alterado
        </h1>
      </div>

      <!-- Opciones -->
      <div class="space-y-3" id="opciones-container">
        <button class="opcion-btn w-full p-5 rounded-2xl flex items-center gap-4 text-left active:scale-[0.99] transition-transform" onclick="seleccionarOpcion(this, 0)">
          <span class="w-8 h-8 rounded-lg flex items-center justify-center font-bold text-sm flex-shrink-0" style="background:rgba(255,255,255,0.05);color:#94a3b8;">0</span>
          <span class="font-medium text-slate-200">Para nada</span>
        </button>
        <button class="opcion-btn w-full p-5 rounded-2xl flex items-center gap-4 text-left active:scale-[0.99] transition-transform" onclick="seleccionarOpcion(this, 1)">
          <span class="w-8 h-8 rounded-lg flex items-center justify-center font-bold text-sm flex-shrink-0" style="background:rgba(255,255,255,0.05);color:#94a3b8;">1</span>
          <span class="font-medium text-slate-200">Varios días</span>
        </button>
        <button class="opcion-btn w-full p-5 rounded-2xl flex items-center gap-4 text-left active:scale-[0.99] transition-transform" onclick="seleccionarOpcion(this, 2)">
          <span class="w-8 h-8 rounded-lg flex items-center justify-center font-bold text-sm flex-shrink-0" style="background:rgba(255,255,255,0.05);color:#94a3b8;">2</span>
          <span class="font-medium text-slate-200">Más de la mitad de los días</span>
        </button>
        <button class="opcion-btn w-full p-5 rounded-2xl flex items-center gap-4 text-left active:scale-[0.99] transition-transform" onclick="seleccionarOpcion(this, 3)">
          <span class="w-8 h-8 rounded-lg flex items-center justify-center font-bold text-sm flex-shrink-0" style="background:rgba(255,255,255,0.05);color:#94a3b8;">3</span>
          <span class="font-medium text-slate-200">Casi todos los días</span>
        </button>
      </div>

      <!-- Navegación -->
      <div class="flex items-center gap-4 mt-10">
        <button id="btn-anterior" onclick="anteriorPregunta()" disabled class="flex-1 h-12 rounded-2xl flex items-center justify-center gap-2 font-bold text-sm transition-all disabled:opacity-30" style="background:rgba(255,255,255,0.04);color:#94a3b8;border:1px solid rgba(255,255,255,0.07);">
          <span class="material-symbols-outlined text-lg">arrow_back</span>
          Atrás
        </button>
        <button id="btn-siguiente" onclick="siguientePregunta()" class="flex-[2] h-12 rounded-2xl flex items-center justify-center gap-2 font-bold text-sm transition-all hover:opacity-90 active:scale-95" style="background:linear-gradient(135deg,rgba(96,165,250,0.8),rgba(59,130,246,0.7));">
          Siguiente
          <span class="material-symbols-outlined text-lg">arrow_forward</span>
        </button>
      </div>
    </div>
  </div>
</main>

<!-- Overlay de éxito -->
<div id="pantalla-exito" class="hidden fixed inset-0 z-50 flex flex-col items-center justify-center px-8 text-center" style="background:#020617;">
  <div class="w-20 h-20 rounded-full flex items-center justify-center mb-6" style="background:rgba(96,165,250,0.15);border:1px solid rgba(96,165,250,0.3);">
    <span class="material-symbols-outlined text-4xl" style="color:#60a5fa;font-variation-settings:'FILL' 1;">check_circle</span>
  </div>
  <h2 class="font-headline font-extrabold text-2xl text-white mb-3">Respuestas enviadas</h2>
  <p class="text-slate-400 leading-relaxed mb-8 max-w-sm">Tu psicólogo las recibirá antes de vuestra próxima sesión.</p>
  <a href="escalas_paciente.html" class="px-8 py-3 rounded-2xl font-bold text-sm" style="background:rgba(255,255,255,0.06);color:#e2e8f0;border:1px solid rgba(255,255,255,0.1);text-decoration:none;">
    Volver a Mis Escalas
  </a>
</div>

<div id="error-msg" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 px-6 py-3 rounded-full font-semibold text-sm z-50" style="background:rgba(239,68,68,0.15);color:#f87171;border:1px solid rgba(239,68,68,0.2);"></div>

<script>
const PREGUNTAS = [
  'Sentirse nervioso, ansioso o muy alterado',
  'No poder dejar de preocuparse o no poder controlar la preocupación',
  'Preocuparse demasiado por diferentes cosas',
  'Dificultad para relajarse',
  'Estar tan inquieto que es difícil permanecer sentado tranquilo',
  'Molestarse o ponerse irritable fácilmente',
  'Sentir miedo como si algo terrible pudiera pasar'
];

const TOTAL = 7;
let preguntaActual = 0;
const respuestas = new Array(TOTAL).fill(null);
window.respuestas = respuestas;

function actualizarUI() {
  document.getElementById('pregunta-texto').textContent = PREGUNTAS[preguntaActual];
  document.getElementById('progreso-texto').textContent = 'Pregunta ' + (preguntaActual + 1) + ' de ' + TOTAL;
  document.getElementById('progreso-barra').style.width = (((preguntaActual + 1) / TOTAL) * 100) + '%';
  document.getElementById('btn-anterior').disabled = preguntaActual === 0;

  var btnSig = document.getElementById('btn-siguiente');
  if (preguntaActual === TOTAL - 1) {
    btnSig.innerHTML = 'Ver resultado <span class="material-symbols-outlined text-lg">check</span>';
  } else {
    btnSig.innerHTML = 'Siguiente <span class="material-symbols-outlined text-lg">arrow_forward</span>';
  }

  document.querySelectorAll('.opcion-btn').forEach(function(btn, i) {
    btn.classList.remove('opcion-activa');
    var span = btn.querySelector('span:first-child');
    span.style.background = 'rgba(255,255,255,0.05)';
    span.style.color = '#94a3b8';
    if (respuestas[preguntaActual] === i) {
      btn.classList.add('opcion-activa');
      span.style.background = 'rgba(96,165,250,0.2)';
      span.style.color = '#60a5fa';
    }
  });
}

function seleccionarOpcion(btn, valor) {
  respuestas[preguntaActual] = valor;
  actualizarUI();
  if (preguntaActual < TOTAL - 1) {
    setTimeout(siguientePregunta, 350);
  }
}

function siguientePregunta() {
  if (respuestas[preguntaActual] === null) { return; }
  if (preguntaActual < TOTAL - 1) { preguntaActual++; actualizarUI(); }
  else { enviarResultado(); }
}

function anteriorPregunta() {
  if (preguntaActual > 0) { preguntaActual--; actualizarUI(); }
}

function enviarResultado() {
  document.getElementById('pantalla-exito').classList.remove('hidden');
}

(function init(){
  var nombre = localStorage.getItem('pac_nombre') || 'Paciente';
  var clinica = localStorage.getItem('tp_clinica') || 'Mi Clínica';
  var initiales = nombre.split(' ').map(function(p){return p[0]||'';}).slice(0,2).join('').toUpperCase() || 'P';
  document.getElementById('user-nombre').textContent = nombre;
  document.getElementById('user-avatar').textContent = initiales;
  document.getElementById('nombre-clinica').textContent = clinica;
  if (!localStorage.getItem('tp_user_id') || nombre === 'Paciente Demo') {
    document.getElementById('demo-badge').classList.remove('hidden');
  }
  actualizarUI();
})();

function toggleAppsPanel() {}
function toggleNotif() {}
</script>

<script type="module">
  import { guardaPaciente, guardarEvaluacion } from '../js/paciente.js'
  import { setBotonCargando } from '../js/auth.js'
  import { supabase } from '../js/supabase-client.js'

  const { data: { session } } = await supabase.auth.getSession()
  const modoDemo = false  // demo deshabilitado: se exige login
  if (!modoDemo) await guardaPaciente()

  const solicitudId = new URLSearchParams(location.search).get('solicitud')
  const btnSig = document.getElementById('btn-siguiente')

  function calcularPuntajeGAD7(respuestas) {
    const puntaje = respuestas.reduce((a, b) => a + (b || 0), 0)
    let severidad = 'Mínimo'
    if (puntaje >= 15) severidad = 'Severo'
    else if (puntaje >= 10) severidad = 'Moderado'
    else if (puntaje >= 5) severidad = 'Leve'
    return { puntaje, severidad }
  }

  window.enviarResultado = async function() {
    if (window.respuestas.some(r => r === null)) {
      var err = document.getElementById('error-msg')
      err.textContent = 'Por favor respondé todas las preguntas.'
      err.classList.remove('hidden')
      setTimeout(function(){ err.classList.add('hidden') }, 3000)
      return
    }
    setBotonCargando(btnSig, true)
    try {
      const { puntaje, severidad } = calcularPuntajeGAD7(window.respuestas)
      if (!modoDemo) {
        await guardarEvaluacion({ tipo: 'GAD-7', respuestas: window.respuestas, puntaje, severidad })
        if (solicitudId) await supabase.from('solicitudes_escalas')
          .update({ estado: 'completada', completada_at: new Date().toISOString() })
          .eq('id', solicitudId)
      }
      document.getElementById('pantalla-exito').classList.remove('hidden')
    } catch(e) {
      document.getElementById('pantalla-exito').classList.remove('hidden')
    } finally { setBotonCargando(btnSig, false) }
  }
</script>

</body>
</html>
